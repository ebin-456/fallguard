<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#334155" stroke-width="4" opacity="0.6" />

  <!-- Outer Protective Shield -->
  <path d="M256 64 L396 112 C396 260 336 376 256 424 C176 376 116 260 116 112 Z" 
        fill="#1e293b" stroke="url(#shieldGrad)" stroke-width="14" stroke-linejoin="round" />

  <!-- Shield inner fill accent -->
  <path d="M256 86 L376 128 C376 250 324 350 256 394 C188 350 136 250 136 128 Z" 
        fill="#0f172a" opacity="0.75" />

  <!-- Human Silhouette Falling / Tilting with shockwaves -->
  <!-- Shock wave rings -->
  <circle cx="256" cy="240" r="110" fill="none" stroke="#ef4444" stroke-width="4" stroke-dasharray="10 14" opacity="0.4" />
  
  <!-- Pulse Waveform through center -->
  <path d="M150 256 L195 256 L215 210 L235 300 L255 180 L275 320 L295 240 L315 270 L330 256 L362 256" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Accelerometer / Gravity Arrow -->
  <g transform="translate(256, 360)">
    <circle cx="0" cy="0" r="22" fill="#ef4444" opacity="0.9" filter="url(#glow)" />
    <path d="M0 -12 L0 12 M-7 5 L0 12 L7 5" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Status LED indicator dot -->
  <circle cx="256" cy="115" r="9" fill="#10b981" filter="url(#glow)" />
</svg>
